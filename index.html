<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP 100 PS5 Games - Вторичный рынок</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --price-color: #4ade80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        #games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #334155;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--accent-color);
        }

        .game-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .game-info {
            padding: 20px;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rating {
            background: #facc15;
            color: #000;
            padding: 2px 8px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .price {
            color: var(--price-color);
            font-size: 1.3rem;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            font-size: 1.5rem;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<header>
    <h1>TOP 100 PS5 DISK RATING</h1>
    <p>Актуальные оценки и примерные цены на б/у рынке</p>
</header>

<div class="container">
    <div id="games-grid">
        <div class="loading">Загрузка рейтинга игр...</div>
    </div>
</div>

<script>
    const gamesGrid = document.getElementById('games-grid');

    async function fetchGames() {
        try {
            // Безопасный запрос к НАШЕЙ серверной функции Vercel вместо чужого API напрямую
            const response = await fetch('/api/games');
            
            if (!response.ok) {
                throw new Error('Ошибка ответа сервера');
            }
            
            const allGames = await response.json();
            
            if (allGames.error) {
                gamesGrid.innerHTML = `<div class="loading" style="color: #f87171;">${allGames.error}</div>`;
                return;
            }

            renderGames(allGames);
        } catch (error) {
            gamesGrid.innerHTML = `<div class="loading">Ошибка загрузки данных. Проверьте логи сервера Vercel.</div>`;
            console.error('Error fetching games:', error);
        }
    }

    function calculateUsedPrice(rating, title) {
        // Имитация цены б/у рынка
        const basePrice = 2000;
        const ratingBonus = rating * 100; 
        const randomFluctuation = Math.floor(Math.random() * 500);
        
        return (basePrice + ratingBonus + randomFluctuation).toLocaleString('ru-RU') + ' ₽';
    }

    function renderGames(games) {
        gamesGrid.innerHTML = ''; // Очистка анимации загрузки

        games.forEach((game, index) => {
            const price = calculateUsedPrice(game.rating, game.name);
            
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <img src="${game.background_image || 'https://placeholder.com'}" alt="${game.name}">
                <div class="game-info">
                    <div class="game-title">${index + 1}. ${game.name}</div>
                    <div class="stats">
                        <span class="rating">⭐ ${game.rating}</span>
                        <span class="price">${price}</span>
                    </div>
                </div>
            `;
            gamesGrid.appendChild(card);
        });
    }

    // Запуск приложения
    fetchGames();
</script>

</body>
</html>
